<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>ScriptCode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: three full-screen views (menu, past projects, editor). Editor = files tree | drag handle | code. Start lives in the files panel. */
:root {
  --blue: #00a3ff;
  --sky: #45c8ff;
  --code-bg: #0a7fd1;
  --paper: #fdf6f6;
  --mint: #d6ffc2;
  --ink: #06324f;
  --font-ui: "Nunito Sans", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; }
body { margin: 0; background: var(--blue); color: #fff; font-family: var(--font-ui); font-weight: 800; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* Menu */
.menu { align-items: center; padding-inline: var(--gutter-l) var(--gutter-r); padding-block: 8vh 24px; text-align: center; background: var(--blue); }
.logo { font-size: clamp(110px, 34vw, 170px); line-height: 1; color: #f3f3f3; text-shadow: 6px 6px 0 rgba(0,90,200,.25); letter-spacing: -.02em; }
.menu h1 { margin: 12px 0 0; font-size: clamp(30px, 8.6vw, 46px); line-height: 1.25; text-wrap: balance; font-weight: 800; }
.menu-actions { width: 100%; max-width: 440px; margin-top: 7vh; display: grid; gap: 14px; }
.btn { display: block; width: 100%; padding: 12px; background: var(--paper); border-radius: 999px; }
.btn > span { display: block; padding: 20px 12px; background: var(--blue); color: #fff; font-size: clamp(24px, 7vw, 34px); border-radius: 999px; }
.btn:active > span { background: #0090e6; }
.menu-foot { margin-top: auto; color: rgba(255,255,255,.55); font-size: 14px; line-height: 1.5; max-width: 320px; }

/* Past projects */
.list { background: var(--blue); padding-inline: var(--gutter-l) var(--gutter-r); padding-block: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.back { font-size: 18px; padding: 10px 14px; background: rgba(255,255,255,.2); border-radius: 999px; }
.topbar h2 { margin: 0; font-size: 26px; }
.projects { display: grid; gap: 10px; align-content: start; overflow: auto; list-style: none; padding: 0; margin: 0; }
.projects button { width: 100%; text-align: left; padding: 16px 24px; background: var(--paper); color: var(--ink); display: flex; justify-content: space-between; gap: 12px; font-size: 20px; border-radius: 999px; }
.projects small { font-weight: 600; opacity: .65; font-size: 14px; align-self: center; white-space: nowrap; }

/* Editor */
.editor { flex-direction: row; background: var(--code-bg); }
.files { --pw: 220px; width: var(--pw); flex: none; background: var(--sky); display: flex; flex-direction: column; overflow: hidden; padding-block: 14px; padding-inline: var(--gutter-l) 12px; transition: width .18s ease; }
.files.drag { transition: none; }
.files.closed { padding-inline: 0; }
.files > * { min-width: calc(220px - var(--gutter-l)); }
.back-files { align-self: flex-start; margin: 0 0 12px; padding: 8px 14px; font-size: 16px; white-space: nowrap; background: rgba(255,255,255,.35); }
.files-list, .sub { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; align-content: start; }
.files-list { overflow: auto; }
.sub { margin: 6px 0 0 18px; animation: fadein .25s both; }
.row { display: flex; align-items: center; gap: 6px; }
.file { flex: 1; min-width: 0; text-align: left; padding: 10px 14px; font-family: var(--font-code); font-weight: 500; font-size: 15px; background: rgba(255,255,255,.28); white-space: nowrap; overflow: hidden; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
.file[aria-current="true"] { background: #fff; color: var(--ink); }
.thumb { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: none; }
.plus { flex: none; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.28); font-size: 22px; line-height: 1; display: grid; place-items: center; padding-bottom: 2px; }
.chev { flex: none; width: 22px; height: 34px; font-size: 22px; line-height: 1; display: grid; place-items: center; transition: transform .2s ease; }
.chev.open { transform: rotate(90deg); }
.add-file { margin-top: 8px; padding: 10px 14px; background: rgba(255,255,255,.28); text-align: left; font-size: 15px; border-radius: 999px; }
.chooser { margin-top: 8px; display: grid; gap: 6px; animation: rise .25s both; }
.chooser-label { font-size: 13px; font-weight: 600; padding-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chooser button { padding: 10px 14px; background: #fff; color: var(--ink); font-size: 15px; border-radius: 999px; text-align: left; }
.chooser .cancel { background: rgba(255,255,255,.28); color: #fff; }
.new-name { margin-top: 8px; width: 100%; padding: 10px 14px; font: 500 15px var(--font-code); border: 0; background: #fff; color: var(--ink); border-radius: 999px; }
.spacer { flex: 1; min-height: 12px; }
.start { margin-top: auto; padding: 8px; background: #fff; border-radius: 999px; }
.start > span { display: block; padding: 14px; background: var(--blue); font-size: 26px; text-align: center; border-radius: 999px; }

.handle { flex: none; width: 26px; background: #fff; display: grid; place-items: center; touch-action: none; cursor: col-resize; padding: 0; overflow: hidden; transition: width .2s ease, background .15s ease; }
.grip { width: 6px; height: 56px; border-radius: 3px; background: #b7dff5; transition: background .15s ease, height .15s ease; }

.code-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; padding-right: env(safe-area-inset-right, 0px); }
.code-area { flex: 1; min-height: 0; display: flex; }
.gutter { flex: none; overflow: hidden; padding: 14px 8px 14px 12px; text-align: right; color: rgba(214,255,194,.45); font: 500 15px/1.6 var(--font-code); white-space: pre; user-select: none; }
.code { flex: 1; min-width: 0; resize: none; border: 0; background: transparent; color: var(--mint); font: 500 15px/1.6 var(--font-code); padding: 14px 16px 14px 6px; white-space: pre; overflow: auto; tab-size: 4; }
.img-view { flex: 1; min-width: 0; overflow: auto; display: grid; place-items: center; padding: 16px; animation: fadein .3s both; }
.img-view img { max-width: 100%; max-height: 100%; border-radius: 24px; box-shadow: 0 8px 0 rgba(0,0,0,.15); animation: pop .4s both; }

.out { position: absolute; inset: 0; background: #06324f; color: #e8f6ff; display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
.start.stop > span { background: #ff5a6e; }
.start.stop:hover > span { background: #f2425a; }
.out-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 10px 20px; background: #0a4a73; font-size: 16px; }
.out-head button { padding: 4px 14px; background: rgba(255,255,255,.18); border-radius: 999px; }
.out pre { margin: 0; padding: 14px 20px; overflow: auto; flex: 1; font: 500 14px/1.55 var(--font-code); white-space: pre-wrap; }

/* Animations */
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.4) rotate(-8deg); } 70% { transform: scale(1.1) rotate(2deg); } 100% { opacity: 1; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes screenIn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideX { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: none; } }
@keyframes demoIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.7); } 70%, 100% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-9px); } 60% { transform: translateX(5px); } }
@keyframes glow { 0%, 100% { text-shadow: 6px 6px 0 rgba(0,90,200,.25); } 50% { text-shadow: 10px 12px 0 rgba(0,90,200,.18); } }

.screen:not([hidden]) { animation: screenIn .32s cubic-bezier(.2,.8,.2,1) both; }
.logo { animation: pop .7s cubic-bezier(.2,.9,.3,1.2) both, floaty 3.6s .8s ease-in-out infinite, glow 3.6s .8s ease-in-out infinite; }
.menu h1 { animation: rise .55s .2s cubic-bezier(.2,.8,.2,1) both; }
.menu-actions .btn:nth-child(1) { animation: rise .55s .35s cubic-bezier(.2,.8,.2,1) both; }
.menu-actions .btn:nth-child(2) { animation: rise .55s .48s cubic-bezier(.2,.8,.2,1) both; }
.menu-foot { animation: fadein .8s .8s both; }
.btn { transition: transform .15s ease, box-shadow .15s ease; }
.btn > span { transition: background .15s ease; }
.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,70,160,.25); }
.btn:active { transform: translateY(1px) scale(.98); box-shadow: none; }
.back { transition: background .15s ease, transform .15s ease; }
.back:hover { background: rgba(255,255,255,.35); }
.back:active { transform: scale(.92); }
.topbar { animation: slideX .4s .05s both; }
.projects li { animation: rise .4s calc(var(--i, 0) * 70ms + .1s) cubic-bezier(.2,.8,.2,1) both; }
.projects button { transition: transform .15s ease, box-shadow .15s ease; }
.projects button:hover { transform: translateX(6px); box-shadow: -6px 0 0 #fff; }
.projects button:active { transform: scale(.98); }
.files-list > li.enter { animation: slideX .4s calc(var(--i, 0) * 80ms + .15s) cubic-bezier(.2,.8,.2,1) both; }
.file { transition: background .2s ease, color .2s ease, transform .12s ease; }
.file:hover { transform: translateX(4px); }
.file:active { transform: scale(.97); }
.plus { transition: background .15s ease, transform .15s ease; }
.plus:hover { background: #fff; color: var(--ink); transform: rotate(90deg); }
.plus:active { transform: scale(.88); }
.add-file, .chooser button { transition: background .15s ease, transform .12s ease; }
.add-file:hover { background: rgba(255,255,255,.45); }
.add-file:active, .chooser button:active { transform: scale(.97); }
.new-name { animation: rise .25s both; }
.start { transition: transform .12s ease; animation: ring 2.2s 1s ease-out infinite; }
.start:active { transform: scale(.94); animation: none; }
.start > span { transition: background .15s ease; }
.start:hover > span { background: #0090e6; }
.handle.hint .grip { animation: nudge 1.1s .7s 2; }
.handle:active .grip { background: #6fb9e6; }
.handle:hover .grip { height: 72px; }
.code-wrap { animation: fadein .5s .1s both; }
.out:not([hidden]) { animation: demoIn .3s cubic-bezier(.2,.8,.2,1) both; }
.out-head span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 50%; background: #3dff8b; animation: blink 1.2s infinite; }
.out:not([hidden]) pre { animation: fadein .4s .25s both; }
.out-head button { transition: background .15s ease, transform .12s ease; }
.out-head button:active { transform: scale(.92); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<main>
  <section class="screen menu" id="menu">
    <div class="logo" aria-hidden="true">{§}</div>
    <h1>Добро пожаловать<br>в ScriptCode!</h1>
    <div class="menu-actions">
      <button class="btn" id="btn-new"><span>Новый проект</span></button>
      <button class="btn" id="btn-past"><span>Прошлые проекты</span></button>
    </div>
    <p class="menu-foot">ScriptCode • Font: Nunito Sans ExtraBold • Trademark: {§}</p>
  </section>

  <section class="screen list" id="past" hidden>
    <div class="topbar"><button class="back" id="past-back" aria-label="Назад">‹ Меню</button><h2>Прошлые проекты</h2></div>
    <ul class="projects" id="projects"></ul>
  </section>

  <section class="screen editor" id="editor" hidden>
    <aside class="files" id="files">
      <button class="back back-files" id="ed-back" aria-label="В меню">‹ Меню</button>
      <ul class="files-list" id="files-list"></ul>
      <div id="new-slot"></div>
      <button class="add-file" id="add-file">+ Новый файл</button>
      <input type="file" id="img-in" accept="image/*" multiple hidden>
      <div class="spacer"></div>
      <button class="start" id="start"><span>Start</span></button>
    </aside>
    <button class="handle" id="handle" aria-label="Потяни в сторону, чтобы скрыть или показать файлы"><span class="grip"></span></button>
    <div class="code-wrap">
      <div class="code-area">
        <div class="gutter" id="gutter" aria-hidden="true"></div>
        <textarea class="code" id="code" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Код"></textarea>
        <div class="img-view" id="img-view" hidden><img id="img-el" alt="Загруженная картинка"></div>
      </div>
      <div class="out" id="out" hidden>
        <div class="out-head"><span>Демонстрация</span><button id="out-close">Стоп</button></div>
        <pre id="out-text"></pre>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  var SAMPLE = [
    'import random', '',
    'secret = random.randint(1, 100)', 'attempts = 0', '',
    'print("🎮 Угадай число!")', 'print("Я загадал число от 1 до 100.")', '',
    'while True:', '    guess = input("Твой ответ: ")', '',
    '    if not guess.isdigit():', '        print("Введи целое число!")', '        continue', '',
    '    guess = int(guess)', '    attempts += 1', '',
    '    if guess < secret:', '        print("Моё число больше!")',
    '    elif guess > secret:', '        print("Моё число меньше!")',
    '    else:', '        print("🎉 Ты угадал!")', '        print("Попыток:", attempts)', '        break', ''
  ].join('\n');

  var KEY = 'scriptcode.projects.v1';
  var projects = [];
  try { projects = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { projects = []; }
  if (!projects.length) {
    projects = [{ id: 1, name: 'Угадай число', files: [{ name: 'main', code: SAMPLE }] }];
  }
  var cur = null, curFile = null, pendingParent = null;

  function save() { try { localStorage.setItem(KEY, JSON.stringify(projects)); } catch (e) {} }
  function $(id) { return document.getElementById(id); }
  function show(id) { ['menu', 'past', 'editor'].forEach(function (s) { $(s).hidden = s !== id; }); }
  function dn(name) { return String(name).replace(/\.py$/i, ''); }
  function count(list) { return list.reduce(function (n, f) { return n + 1 + count(f.children || []); }, 0); }
  function sibs(parent) { if (parent) { parent.children = parent.children || []; return parent.children; } return cur.files; }
  function uniqueName(list, name) {
    var base = name, n = 1;
    while (list.some(function (x) { return x.name === name; })) { name = base.replace(/(\.\w+)?$/, '_' + (++n) + '$1'); }
    return name;
  }
  function addNode(parent, node) {
    sibs(parent).push(node);
    if (parent) parent.open = true;
    curFile = node; save(); renderFiles(); loadFile();
  }

  /* menu */
  $('btn-new').onclick = function () {
    var n = projects.reduce(function (m, p) { return Math.max(m, p.id); }, 0) + 1;
    var p = { id: n, name: 'Проект ' + n, files: [{ name: 'main', code: 'print("Привет, ScriptCode!")\n' }] };
    projects.unshift(p); save(); openProject(p);
  };
  $('btn-past').onclick = function () { renderPast(); show('past'); };
  $('past-back').onclick = function () { show('menu'); };
  $('ed-back').onclick = function () { setRunning(false); show('menu'); };

  function renderPast() {
    var ul = $('projects'); ul.innerHTML = '';
    projects.forEach(function (p, i) {
      var li = document.createElement('li'), b = document.createElement('button');
      var a = document.createElement('span'), s = document.createElement('small');
      li.style.setProperty('--i', i);
      var c = count(p.files);
      a.textContent = p.name; s.textContent = c + ' ' + (c === 1 ? 'файл' : (c < 5 ? 'файла' : 'файлов'));
      b.appendChild(a); b.appendChild(s); b.onclick = function () { openProject(p); };
      li.appendChild(b); ul.appendChild(li);
    });
  }

  /* editor */
  function openProject(p) {
    cur = p; curFile = p.files[0]; setRunning(false); $('new-slot').innerHTML = '';
    renderFiles(true); loadFile(); show('editor');
    var h = $('handle'); h.classList.remove('hint'); void h.offsetWidth; h.classList.add('hint');
  }

  function renderFiles(anim) { var ul = $('files-list'); ul.innerHTML = ''; build(ul, cur.files, anim); }

  function build(ul, list, anim) {
    list.forEach(function (f, i) {
      var li = document.createElement('li'), row = document.createElement('div');
      row.className = 'row';
      if (anim) { li.className = 'enter'; li.style.setProperty('--i', i); }
      var kids = f.children || [];
      if (kids.length) {
        var ch = document.createElement('button');
        ch.className = 'chev' + (f.open !== false ? ' open' : ''); ch.textContent = '›';
        ch.setAttribute('aria-label', f.open !== false ? 'Свернуть' : 'Развернуть');
        ch.onclick = function () { f.open = (f.open === false); save(); renderFiles(); };
        row.appendChild(ch);
      }
      var b = document.createElement('button');
      b.className = 'file'; b._node = f;
      if (f.img) { var t = document.createElement('img'); t.src = f.img; t.className = 'thumb'; t.alt = ''; b.appendChild(t); }
      b.appendChild(document.createTextNode(dn(f.name)));
      b.setAttribute('aria-current', f === curFile ? 'true' : 'false');
      b.onclick = function () {
        curFile = f; loadFile();
        [].forEach.call($('files-list').querySelectorAll('.file'), function (x) { x.setAttribute('aria-current', x._node === f ? 'true' : 'false'); });
      };
      var p = document.createElement('button');
      p.className = 'plus'; p.textContent = '+';
      p.setAttribute('aria-label', 'Добавить файл внутрь «' + dn(f.name) + '»');
      p.onclick = function () { openChooser(f); };
      row.appendChild(b); row.appendChild(p); li.appendChild(row);
      if (kids.length && f.open !== false) { var sub = document.createElement('ul'); sub.className = 'sub'; build(sub, kids, false); li.appendChild(sub); }
      ul.appendChild(li);
    });
  }

  function loadFile() {
    setRunning(false);
    var isImg = !!curFile.img;
    $('code').hidden = isImg; $('gutter').hidden = isImg; $('img-view').hidden = !isImg;
    if (isImg) { $('img-el').src = curFile.img; return; }
    $('code').value = curFile.code || ''; lines(); $('code').scrollTop = 0; $('code').scrollLeft = 0;
  }
  function lines() {
    var n = $('code').value.split('\n').length, t = '';
    for (var i = 1; i <= n; i++) t += i + '\n';
    $('gutter').textContent = t;
    $('gutter').scrollTop = $('code').scrollTop;
  }
  $('code').addEventListener('input', function () { curFile.code = this.value; save(); lines(); });
  $('code').addEventListener('scroll', function () { $('gutter').scrollTop = this.scrollTop; });
  $('code').addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = this.selectionStart, en = this.selectionEnd;
      this.value = this.value.slice(0, s) + '    ' + this.value.slice(en);
      this.selectionStart = this.selectionEnd = s + 4;
      this.dispatchEvent(new Event('input'));
    }
  });

  /* new file: choose with picture or without; "+" next to a file adds inside it */
  function openChooser(parent) {
    pendingParent = parent || null;
    var slot = $('new-slot'); slot.innerHTML = '';
    var box = document.createElement('div'); box.className = 'chooser';
    if (parent) { var l = document.createElement('div'); l.className = 'chooser-label'; l.textContent = 'Внутри: ' + dn(parent.name); box.appendChild(l); }
    function mk(text, fn, cls) { var b = document.createElement('button'); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; box.appendChild(b); }
    mk('Без картинки', askName);
    mk('С картинкой', function () { slot.innerHTML = ''; $('img-in').click(); });
    mk('Отмена', function () { slot.innerHTML = ''; }, 'cancel');
    slot.appendChild(box);
  }
  function askName() {
    var slot = $('new-slot'); slot.innerHTML = '';
    var i = document.createElement('input'); i.className = 'new-name'; i.id = 'new-name';
    i.placeholder = 'имя файла'; i.setAttribute('aria-label', 'Имя файла');
    i.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') slot.innerHTML = '';
      if (e.key === 'Enter') {
        var name = i.value.trim();
        if (!name) { slot.innerHTML = ''; return; }
        var list = sibs(pendingParent);
        if (list.some(function (f) { return f.name === name; })) { i.value = ''; i.placeholder = 'такое имя уже есть'; return; }
        slot.innerHTML = '';
        addNode(pendingParent, { name: name, code: '' });
      }
    });
    slot.appendChild(i); i.focus();
  }
  $('add-file').onclick = function () { openChooser(null); };

  /* upload own pictures */
  $('img-in').onchange = function () {
    var list = [].slice.call(this.files), input = this, parent = pendingParent;
    list.forEach(function (file) {
      var rd = new FileReader();
      rd.onload = function () {
        var im = new Image();
        im.onload = function () {
          var s = Math.min(1, 900 / Math.max(im.width, im.height));
          var c = document.createElement('canvas');
          c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var png = /png|gif|webp/i.test(file.type);
          var name = uniqueName(sibs(parent), file.name || 'картинка.png');
          addNode(parent, { name: name, img: c.toDataURL(png ? 'image/png' : 'image/jpeg', 0.85) });
        };
        im.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
    input.value = '';
  };

  /* drag handle: pull sideways to hide files, pull back to show */
  var files = $('files'), handle = $('handle'), drag = null;
  function setW(w) { files.style.setProperty('--pw', w + 'px'); files.style.width = w + 'px'; files.classList.toggle('closed', w < 4); }
  handle.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, w: files.getBoundingClientRect().width, moved: false };
    handle.setPointerCapture(e.pointerId); files.classList.add('drag');
  });
  handle.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x; if (Math.abs(dx) > 4) drag.moved = true;
    var max = Math.min(window.innerWidth * 0.7, 320);
    setW(Math.max(0, Math.min(max, drag.w + dx)));
  });
  function endDrag() {
    if (!drag) return;
    files.classList.remove('drag');
    var w = files.getBoundingClientRect().width;
    if (!drag.moved) w = w > 4 ? 0 : 220;
    else w = w < 90 ? 0 : Math.max(w, 160);
    setW(w); drag = null;
  }
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
  setW(Math.min(220, window.innerWidth * 0.45));

  /* start */
  var running = false;
  function setRunning(on) {
    running = on;
    var s = $('start');
    s.classList.toggle('stop', on);
    s.firstElementChild.textContent = on ? 'Stop' : 'Start';
    $('out').hidden = !on;
  }
  $('start').onclick = function () {
    if (running) { setRunning(false); return; }
    var txt = $('out-text'), f = curFile;
    setRunning(true); txt.textContent = '';
    if (f.img) {
      txt.textContent = 'Это картинка: ' + f.name + '\nЗапускать нечего. Картинка лежит в проекте, её можно подключать в код.';
    } else if (/\.js$/i.test(f.name)) {
      var log = [];
      var c = { log: function () { log.push([].slice.call(arguments).join(' ')); } };
      try { new Function('console', f.code || '')(c); } catch (e) { log.push('Ошибка: ' + e.message); }
      txt.textContent = log.join('\n') || '(программа ничего не вывела)';
    } else {
      txt.textContent = '▶ ' + dn(f.name) + '\n\nВ этом прототипе Python не запускается.\nВ настоящем приложении здесь появится вывод программы.\n\nФайлы с именем на .js запускаются уже сейчас: добавь файл test.js и напиши console.log("привет").';
    }
  };
  $('out-close').onclick = function () { setRunning(false); };

  show('menu');
})();
</script>
